name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run recognizer checks
        run: swift run -Xswiftc -warnings-as-errors RecognizerChecks
      - name: Build release app
        run: ARCHS="arm64 x86_64" ./scripts/build-app.sh
      - name: Verify universal binary
        run: lipo "outputs/Three Finger Switch.app/Contents/MacOS/ThreeFingerSwitch" -verify_arch arm64 x86_64
